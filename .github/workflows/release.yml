name: Release

# Dispatched once the version's draft release holds the Windows and Linux builds.
on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The runner's PATH lacks the host's rustup.
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install --no-self-update
      - name: Build the disk image with ad-hoc signing, without notarization
        run: scripts/mac-app.sh
      - name: Put the disk image on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(cargo pkgid)
          scripts/release-asset.sh "target/release/ELYTerminal-${version##*[#@]}.dmg"
